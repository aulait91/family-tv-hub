<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>우리집 영상관</title>
  <style>
    :root { font-family: system-ui, -apple-system, 'Noto Sans KR', sans-serif; color:#f7f9fc; background:#101b27; font-synthesis:none; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; min-height:100dvh; background:radial-gradient(circle at 50% -10%, #263c50 0%, #101b27 62%); }
    .shell { max-width:1680px; margin:auto; padding:clamp(20px,4vh,58px) clamp(22px,5vw,75px) 60px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:clamp(28px,4vh,54px); }
    h1 { font-size:clamp(36px,4.3vw,66px); margin:0; font-weight:850; letter-spacing:-.04em; }
    .mark { font-size:clamp(35px,4vw,60px); }
    .subtitle { color:#c8d8e8; margin:0 0 46px; font-size:clamp(20px,2vw,29px); }
    .menu { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(18px,2.5vw,42px); }
    .items { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
    button, a { -webkit-tap-highlight-color:transparent; }
    .tile { appearance:none; border:4px solid transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:20px; padding:30px; min-height:clamp(215px,29vh,340px); border-radius:24px; background:#283b50; color:#fff; font-size:clamp(30px,3.2vw,52px); font-weight:750; text-decoration:none; cursor:pointer; box-shadow:0 8px 24px #0002; transition:background .12s,transform .12s,border-color .12s; }
    .tile:nth-child(2) { background:#29484b; } .tile:nth-child(3) { background:#49405d; } .tile:nth-child(4) { background:#594638; }
    .tile .emoji { font-size:clamp(46px,4.7vw,76px); line-height:1; }
    .tile:hover, .item:hover, .back:hover { border-color:#87d1ff; }
    .tile:focus-visible, .item:focus-visible, .back:focus-visible, .tile.remote-selected, .item.remote-selected, .back.remote-selected {
      outline:6px solid #fff; outline-offset:3px; border-color:#4cc3ff; background:#285e84; transform:scale(1.015); z-index:1;
    }
    .titlebar { display:flex; align-items:center; gap:20px; margin-bottom:24px; }
    .titlebar h2 { margin:0; font-size:clamp(31px,3.4vw,50px); letter-spacing:-.035em; }
    .back { color:#fff; background:#2e4053; border:3px solid transparent; border-radius:15px; font-size:clamp(20px,2vw,28px); min-height:65px; padding:8px 24px; cursor:pointer; white-space:nowrap; }
    .item { display:flex; justify-content:center; align-items:center; text-align:center; min-height:135px; border-radius:18px; border:3px solid transparent; padding:20px; color:white; background:#2b4054; text-decoration:none; font-size:clamp(23px,2.2vw,32px); font-weight:720; line-height:1.35; overflow-wrap:anywhere; cursor:pointer; }
    .item.missing { color:#c3ccd5; background:#28323e; cursor:default; }
    .empty { background:#253449; border-radius:18px; padding:28px; font-size:25px; color:#d5e2ee; }
    .foot { color:#9caec0; text-align:center; font-size:clamp(15px,1.4vw,20px); margin-top:32px; line-height:1.6; }
    .error { color:#ffe8ca; background:#593b24; border-radius:15px; padding:20px; font-size:21px; }
    [hidden] { display:none !important; }
    @media(max-width:720px) { .items {grid-template-columns:repeat(2,minmax(0,1fr));} .item{min-height:110px;} .titlebar{flex-wrap:wrap;} }
    @media(max-width:430px) { .shell{padding:20px 16px 36px;} .subtitle{margin-bottom:24px;} .menu{gap:10px;} .tile{min-height:135px;padding:14px;border-radius:17px;font-size:24px;} .items{grid-template-columns:1fr;} .tile .emoji{font-size:34px;} }
    @media(prefers-reduced-motion:reduce) { .tile {transition:none;} }
  </style>
</head>
<body>
  <main class="shell">
    <header><h1>우리집 영상관</h1><div class="mark" aria-hidden="true">🏠</div></header>
    <section id="home">
      <p class="subtitle">보고 싶은 곳을 선택하세요</p>
      <div class="menu" id="menu"></div>
    </section>
    <section id="listing" hidden>
      <div class="titlebar"><button id="back" class="back remote-focus" type="button">← 처음으로</button><h2 id="category-title"></h2></div>
      <div class="items" id="items"></div>
    </section>
    <p id="error" class="error" hidden></p>
    <p id="sync-status" class="foot" hidden></p>
    <p class="foot">방향키로 이동 · 확인 버튼으로 선택 · 뒤로 가기로 이전 화면</p>
  </main>
  <script src="catalog.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    (function () {
      'use strict';
      var categories = [
        {id:'drama',title:'드라마',icon:'📺'},
        {id:'movie',title:'영화',icon:'🎬'},
        {id:'variety',title:'예능',icon:'🎭'},
        {id:'favorites',title:'자주 보기',icon:'❤️'}
      ];
      var home = document.getElementById('home');
      var listing = document.getElementById('listing');
      var menu = document.getElementById('menu');
      var items = document.getElementById('items');
      var titleEl = document.getElementById('category-title');
      var errorEl = document.getElementById('error');
      var backBtn = document.getElementById('back');
      var records = Array.isArray(window.SITE_CATALOG) ? window.SITE_CATALOG : [];
      var syncStatus = document.getElementById('sync-status');
      // 서버 연결이 끊겨도 마지막으로 받아 온 목록을 보여 줍니다.
      try {
        var cached = JSON.parse(localStorage.getItem('familyTvCatalogCache') || 'null');
        if (Array.isArray(cached)) records = cached;
      } catch (_) { /* 저장소 차단 등: 기본 catalog.js 사용 */ }
      function syncMessage(message) {
        syncStatus.textContent = message || '';
        syncStatus.hidden = !message;
      }
      function initOnlineCatalog() {
        var cfg = window.FAMILY_TV_FIREBASE;
        if (!cfg || !cfg.apiKey || !cfg.projectId) return; // 아직 설정 전에는 기존 사이트 그대로
        if (!window.firebase || !firebase.firestore) {
          syncMessage('온라인 목록을 불러오지 못했어요. 저장된 목록을 표시하고 있어요.');
          return;
        }
        try {
          var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
          app.firestore().doc('familyTv/catalog').onSnapshot(function(snapshot) {
            if (!snapshot.exists || !Array.isArray(snapshot.data().items)) {
              syncMessage('아직 온라인 작품 목록이 등록되지 않았어요.');
              return;
            }
            var fresh = snapshot.data().items;
            if (JSON.stringify(records) !== JSON.stringify(fresh)) {
              records = fresh;
              try { localStorage.setItem('familyTvCatalogCache', JSON.stringify(fresh)); } catch (_) {}
              render();
            }
            syncMessage('');
          }, function(error) {
            if (error && error.code === 'permission-denied') {
              syncMessage('온라인 목록 연결을 준비 중이에요. 기존 목록을 표시하고 있어요.');
            } else {
              syncMessage('인터넷 연결을 확인해 주세요. 마지막으로 저장된 목록을 표시하고 있어요.');
            }
          });
        } catch (_) {
          syncMessage('온라인 목록에 연결하지 못했어요. 저장된 목록을 표시하고 있어요.');
        }
      }
      function safeUrl(raw) {
        if (typeof raw !== 'string' || !raw.trim()) return '';
        try { var u=new URL(raw.trim()); return u.protocol==='https:' || u.protocol==='http:' ? u.href : ''; }
        catch (_) { return ''; }
      }
      function addClassFocus(el) {
        document.querySelectorAll('.remote-selected').forEach(function(x){x.classList.remove('remote-selected');});
        if (el) el.classList.add('remote-selected');
      }
      document.addEventListener('focusin',function(e){if(e.target.classList && e.target.classList.contains('remote-focus')) addClassFocus(e.target);});
      function makeButton(text, css, handler) {
        var b=document.createElement('button'); b.type='button'; b.className=css+' remote-focus'; b.textContent=text; b.addEventListener('click',handler); return b;
      }
      categories.forEach(function(c){
        var b=document.createElement('button'); b.type='button'; b.className='tile remote-focus';
        var icon=document.createElement('span'); icon.className='emoji'; icon.setAttribute('aria-hidden','true'); icon.textContent=c.icon;
        var name=document.createElement('span'); name.textContent=c.title;
        b.appendChild(icon); b.appendChild(name);
        b.addEventListener('click',function(){location.hash=c.id;}); menu.appendChild(b);
      });
      function goHome(){ history.replaceState(null,'',location.href.split('#')[0]); render(); }
      backBtn.addEventListener('click',goHome);
      function render() {
        var id=decodeURIComponent(location.hash.replace(/^#/,''));
        var cat=categories.find(function(c){return c.id===id;});
        var isListing=Boolean(cat);
        home.hidden=isListing; listing.hidden=!isListing;
        errorEl.hidden=true;
        if(!isListing){ document.title='우리집 영상관'; addClassFocus(null); return; }
        document.title=cat.title+' · 우리집 영상관'; titleEl.textContent=cat.title;
        items.textContent='';
        var entries=records.filter(function(item){return item && (id==='favorites'? item.favorite===true : item.category===id);});
        if(!entries.length){var empty=document.createElement('p'); empty.className='empty'; empty.textContent='아직 등록된 작품이 없어요.';items.appendChild(empty);}
        entries.forEach(function(item){
          var url=safeUrl(item.url); var title=(typeof item.title==='string' && item.title.trim())?item.title:'제목 없음';
          var el;
          if(url){el=document.createElement('a');el.href=url;el.textContent=title;el.className='item remote-focus';el.rel='noreferrer';}
          else {el=makeButton(title+' (주소 미등록)','item missing',function(){errorEl.textContent='아직 영상 주소를 등록하지 않았어요.';errorEl.hidden=false;});}
          items.appendChild(el);
        });
        addClassFocus(null);
        var firstItem=items.querySelector('.remote-focus');
        if(firstItem) firstItem.focus(); else backBtn.focus();
      }
      function chooseNext(key, current, navigables){
        if (!current || !navigables.includes(current)) return navigables[0];
        var a=current.getBoundingClientRect(); var acx=a.left+a.width/2, acy=a.top+a.height/2;
        var candidates=navigables.filter(function(x){return x!==current;}).map(function(x){
          var b=x.getBoundingClientRect(), dx=b.left+b.width/2-acx, dy=b.top+b.height/2-acy;
          var primary=key==='ArrowRight'?dx:key==='ArrowLeft'?-dx:key==='ArrowDown'?dy:-dy;
          var secondary=(key==='ArrowRight'||key==='ArrowLeft')?Math.abs(dy):Math.abs(dx);
          return {el:x,primary:primary,score:primary+secondary*3};
        }).filter(function(x){return x.primary>6;}).sort(function(a,b){return a.score-b.score;});
        return candidates.length?candidates[0].el:current;
      }
      document.addEventListener('keydown',function(e){
        var key=e.key;
        if(key==='Escape'||key==='Backspace'||key==='BrowserBack'){
          if(!listing.hidden){e.preventDefault();goHome();}return;
        }
        if(!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(key)) return;
        var navigables=Array.prototype.slice.call((listing.hidden?home:listing).querySelectorAll('.remote-focus'));
        
        if(!navigables.length)return;
        var next=chooseNext(key,document.activeElement,navigables);
        e.preventDefault(); if(next)next.focus();
      });
      window.addEventListener('hashchange',render);window.addEventListener('popstate',render);
      render();
      initOnlineCatalog();
    }());
  </script>
</body>
</html>
