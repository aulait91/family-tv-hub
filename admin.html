<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리집 영상관 · 원격 관리</title>
<style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#1e2a35;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:880px;margin:0 auto;padding:22px}h1{margin:6px 0}p{line-height:1.6}.note{background:#e7f1fd;border-radius:12px;padding:16px;margin:16px 0}button,.file{font:inherit;border:1px solid #afbfcd;border-radius:10px;padding:9px 14px;background:white;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:#145d93;border-color:#145d93;color:white;font-weight:700}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.list{display:grid;gap:8px;margin:14px 0}.record{border:1px solid #d9e0e7;background:white;padding:12px;border-radius:12px;display:flex;align-items:center;gap:12px}.record .info{flex:1;min-width:0}.record .info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#536779}.record .actions{display:flex;gap:5px;flex-wrap:wrap}.record button{padding:7px 9px}form{background:#fff;border:1px solid #d9e0e7;padding:20px;border-radius:12px;display:grid;gap:12px}label{display:grid;gap:6px;font-weight:650}input,select{font:inherit;border:1px solid #a1b1c2;border-radius:8px;padding:12px;width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row label{display:flex;align-items:center;font-weight:400}.row input[type=checkbox]{width:20px;height:20px}#status{min-height:24px;color:#165f43}.warning{color:#89421d}.hidden{display:none}.auth{border:1px solid #d9e0e7;background:white;border-radius:12px;padding:16px}.auth small{display:block;overflow-wrap:anywhere}.danger{color:#a13131}code{overflow-wrap:anywhere}.category-section{background:#fff;border:1px solid #d9e0e7;border-left:6px solid #567daa;border-radius:16px;padding:16px;margin:10px 0 20px}.category-section[data-category="movie"]{border-left-color:#568d77}.category-section[data-category="variety"]{border-left-color:#9575aa}.category-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.category-heading h2{font-size:1.4rem;margin:0}.category-heading .count{color:#667887;font-weight:500;font-size:.95rem}.category-records{display:grid;gap:8px}.category-empty{color:#738293;margin:10px 0 14px}.category-add{font-weight:700}.category-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.category-section.sorting{border-color:#5a88ad;box-shadow:0 0 0 2px #d5eafb}.category-records.sorting{user-select:none}.category-records.sorting .record{cursor:grab;touch-action:none;user-select:none;border:2px solid #c0d8ee;transition:background .12s,border-color .12s,box-shadow .12s,transform .12s}.category-records.sorting .record:focus-visible{outline:3px solid #397abb;outline-offset:2px;background:#eff7ff}.category-records.sorting .record.dragging{cursor:grabbing;background:#d7ecff;border:3px solid #1769ae;box-shadow:0 10px 30px #154e8347,0 0 0 4px #b8deff;transform:scale(1.015);position:relative;z-index:2}.category-records.sorting .record.drop-target:not(.dragging){background:#f0f8ff;border-color:#4b9bdd}.reorder-grip{font-size:25px;font-weight:700;color:#6d8ba2;flex:none;pointer-events:none}.reorder-hint{margin:8px 0 12px;color:#45667b;font-size:.95rem}.category-actions button{min-height:40px} @media(max-width:600px){.record{flex-wrap:wrap}.record .actions{width:100%}}
</style>
</head><body><main>
<h1>우리집 영상관 관리</h1>
<p>드라마·영화·예능을 구역별로 관리할 수 있어요. 순서 변경은 드래그한 뒤 저장하면 반영돼요.</p>
<div class="note" id="setup-note">Firebase 연결 전에는 저장할 수 없어요. 동봉된 README의 Firebase 설정을 먼저 완료해 주세요.</div>
<div class="auth">
  <div class="tools"><button id="login" class="primary">구글 계정으로 로그인</button><button id="logout" hidden>로그아웃</button></div>
  <small id="auth-status" aria-live="polite">로그인이 필요합니다.</small>
  <small id="uid-row" hidden>관리자 UID (보안 규칙 설정용): <code id="uid"></code> <button id="copy-uid" type="button">UID 복사</button></small>
</div>
<div class="tools">
  <button id="publish" class="primary" disabled hidden>저장 다시 시도</button>
  <button id="reload" disabled>온라인 목록 다시 읽기</button>
  <button id="download">목록 백업(JSON)</button>
  <label class="file">백업 불러오기 <input type="file" id="upload" accept=".json,application/json" hidden></label>
</div>
<p id="status" role="status" aria-live="polite"></p>
<div class="list" id="records"></div>
<form id="editor" class="hidden">
<h2 id="editor-title">작품 등록</h2>
<label>카테고리<select id="category"><option value="drama">드라마</option><option value="movie">영화</option><option value="variety">예능</option></select></label>
<label>작품 제목<input id="name" required maxlength="120" placeholder="예: 드라마 제목"></label>
<label>첫 영상 주소 (1화 또는 첫 영상 URL)<input id="url" type="url" placeholder="https://..."></label>
<div class="row"><label><input id="favorite" type="checkbox"> 자주 보기에 표시</label></div>
<div class="row"><button type="submit" id="editor-submit" class="primary">등록하고 저장</button><button id="cancel" type="button">취소</button></div>
<p class="warning">URL에는 검색 결과가 아니라 실제로 영상이 나오는 페이지 주소를 넣어 주세요.</p>
</form>
<p>작품 추가·수정·삭제는 자동 저장돼요. 순서 변경은 각 구역에서 「순서 변경 → 드래그 → 저장」으로 진행해요. JSON 백업은 별도 보관용입니다.</p>
<script src="catalog.js"></script>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){'use strict';
var cats={drama:'드라마',movie:'영화',variety:'예능'};
var current=Array.isArray(window.SITE_CATALOG)?JSON.parse(JSON.stringify(window.SITE_CATALOG)):[];
var dirty=false,ready=false,editing=null,saving=false,auth=null,docRef=null,uid='',saveRevision=0;
var reorderCategory=null,reorderOrder=[],dragState=null;
var list=document.getElementById('records'),form=document.getElementById('editor'),status=document.getElementById('status');
var category=document.getElementById('category'),name=document.getElementById('name'),url=document.getElementById('url'),favorite=document.getElementById('favorite');
var publish=document.getElementById('publish'),reload=document.getElementById('reload');
function msg(t){status.textContent=t;}
function controls(){reload.disabled=!ready||saving||Boolean(reorderCategory);publish.disabled=!ready||saving||!dirty;publish.hidden=!dirty||saving;document.getElementById('upload').disabled=!ready||saving||Boolean(reorderCategory);document.getElementById('logout').disabled=saving||Boolean(reorderCategory);}
function modified(){dirty=true;saveRevision++;controls();render();msg('변경 사항을 자동 저장하는 중...');saveRemote();}
function validUrl(raw){if(typeof raw!=='string'||!raw.trim())return true;try{var u=new URL(raw);return u.protocol==='http:'||u.protocol==='https:';}catch(_){return false;}}
function validItem(x){return x&&typeof x.id==='string'&&x.id.length<=100&&cats[x.category]&&typeof x.title==='string'&&x.title.trim()&&x.title.length<=120&&typeof x.url==='string'&&x.url.length<=2048&&validUrl(x.url)&&typeof x.favorite==='boolean';}
function validItems(xs){return Array.isArray(xs)&&xs.length<=200&&xs.every(validItem);}
// 순서 편집은 화면 안에서만 임시로 처리하고, '저장'을 눌렀을 때만 current에 반영합니다.
function startReorder(catId){
 if(!ready||saving||dirty||reorderCategory)return;
 if(!form.classList.contains('hidden')){
   msg('열려 있는 작품 편집을 완료하거나 취소한 뒤 순서를 변경해 주세요.');return;
 }
 reorderCategory=catId;
 reorderOrder=[];
 current.forEach(function(item,i){if(item.category===catId)reorderOrder.push(i);});
 controls();render();
 msg(cats[catId]+' 순서를 드래그해서 바꾼 뒤 저장해 주세요. 취소하면 기존 순서가 유지돼요.');
}
function stopReorder(){
 if(!reorderCategory)return;
 dragState=null;reorderCategory=null;reorderOrder=[];
 controls();render();msg('순서 변경을 취소했어요. 기존 순서는 그대로예요.');
}
function saveReorder(){
 if(!reorderCategory||!ready||saving||dirty)return;
 var categoryId=reorderCategory;
 var positions=[];
 current.forEach(function(item,i){if(item.category===categoryId)positions.push(i);});
 if(positions.length!==reorderOrder.length ||
    reorderOrder.some(function(index){return positions.indexOf(index)===-1;}) ||
    new Set(reorderOrder).size!==positions.length){
   msg('순서 목록을 확인할 수 없어요. 취소 후 다시 시도해 주세요.');return;
 }
 var snapshot=current.slice();
 var changed=false;
 positions.forEach(function(slot,i){if(snapshot[slot]!==snapshot[reorderOrder[i]])changed=true;current[slot]=snapshot[reorderOrder[i]];});
 dragState=null;reorderCategory=null;reorderOrder=[];
 controls();
 if(changed)modified();
 else {render();msg('변경된 순서가 없어 저장하지 않았어요.');}
}
function onRowPointerDown(event,row,group){
 if(!reorderCategory||saving||!ready||dragState||event.isPrimary===false ||
    (event.pointerType==='mouse'&&event.button!==0))return;
 event.preventDefault();
 dragState={pointerId:event.pointerId,row:row,group:group,startY:event.clientY};
 row.focus();
 row.classList.add('dragging');
}
window.addEventListener('pointermove',function(event){
 var drag=dragState;
 if(!drag||event.pointerId!==drag.pointerId)return;
 event.preventDefault();
 var siblings=Array.prototype.slice.call(drag.group.querySelectorAll('.record')).filter(function(node){return node!==drag.row;});
 var target=null;
 siblings.forEach(function(node){node.classList.remove('drop-target');});
 for(var i=0;i<siblings.length;i++){
   var rect=siblings[i].getBoundingClientRect();
   if(event.clientY<rect.top+rect.height/2){target=siblings[i];break;}
 }
 if(target){target.classList.add('drop-target');drag.group.insertBefore(drag.row,target);}
 else {if(siblings.length)siblings[siblings.length-1].classList.add('drop-target');drag.group.appendChild(drag.row);}
});
function finishDrag(event,cancel){
 if(!dragState||event.pointerId!==dragState.pointerId)return;
 var drag=dragState;dragState=null;
 drag.row.classList.remove('dragging');
 drag.group.querySelectorAll('.drop-target').forEach(function(node){node.classList.remove('drop-target');});
 if(cancel){render();return;}
 reorderOrder=Array.prototype.slice.call(drag.group.querySelectorAll('.record')).map(function(node){return Number(node.dataset.originalIndex);});
 render();
 msg('순서 변경 중이에요. 이 순서로 반영하려면 저장을 눌러 주세요.');
}
window.addEventListener('pointerup',function(event){finishDrag(event,false);});
window.addEventListener('pointercancel',function(event){finishDrag(event,true);});
window.addEventListener('blur',function(){if(dragState){dragState=null;render();}});
function moveDraftByKeyboard(index,delta){
 if(reorderCategory===null||saving)return;
 var at=reorderOrder.indexOf(index),next=at+delta;
 if(at<0||next<0||next>=reorderOrder.length)return;
 var old=reorderOrder[at];reorderOrder[at]=reorderOrder[next];reorderOrder[next]=old;
 render();
 var target=list.querySelector('.sorting .record[data-original-index="'+index+'"]');
 if(target)target.focus();
 msg('순서 변경 중이에요. 저장을 누르면 반영돼요.');
}
function render(){
 list.textContent='';
 ['drama','movie','variety'].forEach(function(catId){
   var matching=[];
   current.forEach(function(item,i){if(item.category===catId)matching.push({item:item,index:i});});
   var sorting=reorderCategory===catId;
   if(sorting){
     matching=reorderOrder.map(function(index){return {item:current[index],index:index};});
   }
   var section=document.createElement('section');
   section.className='category-section'+(sorting?' sorting':'');section.dataset.category=catId;
   var heading=document.createElement('div');heading.className='category-heading';
   var title=document.createElement('h2');title.textContent=cats[catId]+' ';
   var count=document.createElement('span');count.className='count';count.textContent='('+matching.length+'개)';
   title.appendChild(count);
   var buttons=document.createElement('div');buttons.className='category-actions';
   var addCategory=document.createElement('button');addCategory.type='button';addCategory.className='category-add primary';
   addCategory.textContent='+ 작품 추가';
   addCategory.disabled=!ready||saving||Boolean(reorderCategory);
   addCategory.addEventListener('click',function(){edit(null,catId);});
   buttons.appendChild(addCategory);
   if(sorting){
     var saveButton=document.createElement('button');
     saveButton.type='button';saveButton.className='primary';saveButton.textContent='순서 저장';
     saveButton.addEventListener('click',saveReorder);
     var cancelButton=document.createElement('button');
     cancelButton.type='button';cancelButton.textContent='취소';
     cancelButton.addEventListener('click',stopReorder);
     buttons.append(saveButton,cancelButton);
   }else{
     var reorderButton=document.createElement('button');
     reorderButton.type='button';reorderButton.textContent='순서 변경';
     reorderButton.disabled=!ready||saving||dirty||Boolean(reorderCategory)||matching.length<2;
     reorderButton.addEventListener('click',function(){startReorder(catId);});
     buttons.appendChild(reorderButton);
   }
   heading.append(title,buttons);section.appendChild(heading);
   if(sorting){
     var hint=document.createElement('p');hint.className='reorder-hint';
     hint.textContent='작품 칸 전체를 잡고 위아래로 끌어 순서를 바꿔요. 저장 전에는 반영되지 않아요.';
     section.appendChild(hint);
   }
   var group=document.createElement('div');group.className='category-records'+(sorting?' sorting':'');
   if(!matching.length){
     var empty=document.createElement('p');empty.className='category-empty';empty.textContent='아직 등록된 작품이 없어요.';group.appendChild(empty);
   }
   matching.forEach(function(row){
     var item=row.item,i=row.index;
     var div=document.createElement('div');div.className='record';div.dataset.originalIndex=String(i);
     var info=document.createElement('div');info.className='info';
     var itemTitle=document.createElement('strong');itemTitle.textContent=item.title+(item.favorite?' ★':'');
     var link=document.createElement('small');link.textContent=item.url||'(주소 미등록)';
     info.append(itemTitle,link);
     var actions=document.createElement('div');actions.className='actions';
     if(sorting){
       div.tabIndex=0;
       div.setAttribute('role','button');
       div.setAttribute('aria-label',item.title+' 순서 변경. 카드를 드래그하거나 위아래 방향키를 누르세요.');
       div.addEventListener('pointerdown',function(event){onRowPointerDown(event,div,group);});
       div.addEventListener('keydown',function(event){
         if(event.key==='ArrowUp'||event.key==='ArrowDown'){
           event.preventDefault();moveDraftByKeyboard(i,event.key==='ArrowUp'?-1:1);
         }
       });
       var grip=document.createElement('span');grip.className='reorder-grip';grip.textContent='↕';
       grip.setAttribute('aria-hidden','true');
       actions.appendChild(grip);
     }else{
       function act(text,fn){
         var button=document.createElement('button');button.type='button';button.textContent=text;
         button.disabled=!ready||saving||Boolean(reorderCategory);
         button.addEventListener('click',fn);actions.appendChild(button);
       }
       act('수정',function(){edit(i);});
       act('삭제',function(){if(confirm('이 작품을 목록에서 삭제할까요?')){current.splice(i,1);modified();}});
     }
     div.append(info,actions);group.appendChild(div);
   });
   section.appendChild(group);list.appendChild(section);
 });
}
function edit(i,preferredCategory){if(!ready||saving||reorderCategory)return;editing=i;list.classList.add('hidden');form.classList.remove('hidden');document.getElementById('editor-title').textContent=i===null?'작품 등록':'작품 수정';
 document.getElementById('editor-submit').textContent=i===null?'등록하고 저장':'수정하고 저장';
 var v=i===null?{category:preferredCategory||'drama',title:'',url:'',favorite:false}:current[i];
 category.value=v.category;name.value=v.title;url.value=v.url||'';favorite.checked=Boolean(v.favorite);name.focus();form.scrollIntoView({behavior:'smooth',block:'nearest'});}
function closeEditor(){form.classList.add('hidden');list.classList.remove('hidden');editing=null;}
document.getElementById('cancel').addEventListener('click',function(){closeEditor();});
form.addEventListener('submit',function(e){e.preventDefault();if(!ready||saving||reorderCategory)return;
 var raw=url.value.trim();if(!validUrl(raw)){alert('http:// 또는 https:// 로 시작하는 URL을 입력해 주세요.');return;}
 var item={id:editing===null?'item-'+Date.now()+'-'+Math.floor(Math.random()*100000):current[editing].id,category:category.value,title:name.value.trim(),url:raw,favorite:favorite.checked};
 if(!validItem(item)){alert('작품 제목이나 주소를 확인해 주세요.');return;}
 if(editing===null){if(current.length>=200){alert('작품은 최대 200개까지 등록할 수 있어요.');return;}current.push(item);}else current[editing]=item;
 closeEditor();modified();
});
function asTextError(e){if(e&&e.code==='permission-denied')return '저장 권한이 없어요. Firestore Rules의 관리자 UID를 확인해 주세요.';return '저장 실패: '+(e&&e.message?e.message:'네트워크와 Firebase 설정 확인 필요');}
function loadRemote(){if(!ready||saving||reorderCategory)return;if(dirty&&!confirm('저장하지 않은 변경 사항을 버리고 온라인 목록을 불러올까요?'))return;
 saving=true;controls();msg('온라인 목록을 불러오는 중...');
 docRef.get().then(function(snapshot){
   if(snapshot.exists&&validItems(snapshot.data().items)){current=JSON.parse(JSON.stringify(snapshot.data().items));dirty=false;msg('온라인 목록을 불러왔어요.');}
   else if(!snapshot.exists){current=Array.isArray(window.SITE_CATALOG)?JSON.parse(JSON.stringify(window.SITE_CATALOG)):[];dirty=false;msg('온라인 목록이 아직 없어요. 작품을 등록하거나 수정하면 자동 저장돼요.');}
   else{msg('온라인 목록 형식이 올바르지 않아요. 기존 화면을 유지해요.');}
 }).catch(function(e){msg('불러오기 실패: '+(e&&e.message?e.message:''));}).finally(function(){saving=false;controls();render();});
}
reload.addEventListener('click',loadRemote);
function saveRemote(){
 if(!ready||saving||!dirty)return;
 if(!validItems(current)){msg('자동 저장 실패: 작품 제목과 URL을 확인해 주세요.');return;}
 var thisRevision=saveRevision;
 // 전송 시점의 데이터를 복사해 두고, 이후 수정이 생기면 다음 저장으로 넘깁니다.
 var toSave=JSON.parse(JSON.stringify(current));
 saving=true;controls();render();msg('Firebase에 자동 저장하는 중...');
 docRef.set({schemaVersion:1,items:toSave,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
 .then(function(){
   if(thisRevision===saveRevision){
     dirty=false;msg('자동 저장 완료! 우리집 영상관에 반영됐어요.');
   }else{
     msg('추가 변경 사항을 저장하는 중...');
   }
 })
 .catch(function(e){msg(asTextError(e));})
 .finally(function(){
   saving=false;controls();render();
   if(dirty&&thisRevision!==saveRevision)saveRemote();
 });
}
publish.addEventListener('click',saveRemote);
document.getElementById('download').addEventListener('click',function(){
 var blob=new Blob([JSON.stringify({schemaVersion:1,items:current},null,2)],{type:'application/json;charset=utf-8'});var a=document.createElement('a');var objectURL=URL.createObjectURL(blob);
 a.href=objectURL;a.download='family-tv-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(objectURL);},2000);msg('현재 목록을 JSON으로 백업했어요.');
});
document.getElementById('upload').addEventListener('change',function(e){
 var file=e.target.files&&e.target.files[0];if(!file)return;
 if(!ready||saving||reorderCategory){msg('편집 또는 저장 중에는 백업을 불러올 수 없어요.');e.target.value='';return;}
 var reader=new FileReader();reader.onload=function(){try{if(!ready||saving)throw new Error('다른 작업이 끝난 뒤 다시 시도해 주세요.');var parsed=JSON.parse(reader.result),items=Array.isArray(parsed)?parsed:parsed.items;
 if(!validItems(items))throw new Error('목록 형식이 잘못되었어요.');if(!confirm('현재 편집 중인 목록을 백업 내용으로 교체할까요?'))return;
 current=JSON.parse(JSON.stringify(items));modified();}
 catch(err){msg('백업 불러오기 실패: '+err.message);}finally{e.target.value='';}};reader.readAsText(file);
});
function initialize(){
 var cfg=window.FAMILY_TV_FIREBASE;
 if(!cfg||!cfg.apiKey||!cfg.projectId||!cfg.authDomain||!cfg.appId||!window.firebase||!firebase.auth||!firebase.firestore){
  msg('Firebase 설정이 필요해요. firebase-config.js를 작성하고 다시 접속해 주세요.');render();return;
 }
 try {
  var app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
  auth=app.auth();docRef=app.firestore().doc('familyTv/catalog');
  document.getElementById('setup-note').textContent='작품을 추가·수정하면 자동 저장돼요. 로그인만으로 수정 권한이 생기는 것은 아니며 Firestore 보안 규칙에서 관리자 UID를 허용해야 해요.';
  document.getElementById('login').addEventListener('click',function(){auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){msg('구글 로그인 실패: '+e.message+' (Firebase 인증 도메인 설정을 확인해 주세요.)');});});
  document.getElementById('logout').addEventListener('click',function(){if(reorderCategory){msg('순서 저장 또는 취소 후 로그아웃해 주세요.');return;}if(saving){msg('저장 중이에요. 저장 완료 후 로그아웃해 주세요.');return;}if(dirty&&!confirm('저장하지 않은 변경 사항을 버리고 로그아웃할까요?'))return;auth.signOut();});
  document.getElementById('copy-uid').addEventListener('click',function(){var id=document.getElementById('uid').textContent;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(id).then(function(){msg('UID를 복사했어요.');});});
  auth.onAuthStateChanged(function(user){
    ready=Boolean(user);uid=user?user.uid:'';dirty=false;saveRevision=0;reorderCategory=null;reorderOrder=[];dragState=null;closeEditor();
    document.getElementById('login').hidden=Boolean(user);document.getElementById('logout').hidden=!user;
    document.getElementById('uid-row').hidden=!user;document.getElementById('uid').textContent=uid;
    document.getElementById('auth-status').textContent=user?'로그인: '+(user.email||'구글 계정'):'로그인이 필요합니다.';
    controls();render();
    if(user)loadRemote();else msg('구글 로그인 후 작품을 편집할 수 있어요.');
  });
 }catch(e){msg('Firebase 초기화 실패: '+e.message);render();}
}
window.addEventListener('beforeunload',function(e){if(dirty||reorderCategory){e.preventDefault();e.returnValue='';}});
render();initialize();
}());
</script></main></body></html>
