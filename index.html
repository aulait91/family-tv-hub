<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>우리집 영상관</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, 'Noto Sans KR', sans-serif;
      color:#f7f9fc;
      background:#091422;
      font-synthesis:none;
      --bg-a:#07101b;
      --bg-b:#13263b;
      --panel:#20364b;
      --panel-soft:#2a435c;
      --text-soft:#c9d8e7;
      --focus:#8fd7ff;
      --shadow:0 18px 46px rgba(0,0,0,.28);
      --shadow-soft:0 10px 26px rgba(0,0,0,.18);
    }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; min-height:100dvh;
      background:
        radial-gradient(circle at 50% -15%, rgba(90,134,181,.40) 0%, rgba(90,134,181,0) 34%),
        linear-gradient(90deg, #06101a 0%, #17304a 50%, #06101a 100%);
    }
    .shell { max-width:1500px; margin:auto; padding:clamp(26px,4vh,58px) clamp(26px,5vw,82px) 64px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:clamp(26px,3.8vh,48px); }
    .branding { display:flex; flex-direction:column; gap:10px; }
    h1 { font-size:clamp(48px,5vw,76px); margin:0; font-weight:850; letter-spacing:-.045em; line-height:1.02; }
    .header-copy { color:var(--text-soft); font-size:clamp(18px,1.75vw,25px); margin:0; }
    .mark {
      width:78px; height:78px; display:grid; place-items:center; flex:none;
      font-size:42px; border-radius:24px;
      background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
      box-shadow:var(--shadow-soft); border:1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }
    .subtitle { color:#d8e6f3; margin:0 0 28px; font-size:clamp(22px,2.1vw,30px); }
    .menu { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(22px,2.5vw,34px); }
    .items { display:grid; grid-template-columns:1fr; gap:18px; width:100%; max-width:1150px; }
    button, a { -webkit-tap-highlight-color:transparent; }
    .tile {
      appearance:none; border:3px solid rgba(255,255,255,.05); display:flex; flex-direction:column;
      align-items:center; justify-content:center; text-align:center; gap:18px;
      padding:30px; min-height:clamp(208px,30vh,310px); border-radius:30px;
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      color:#fff; font-size:clamp(34px,3.3vw,52px); font-weight:800; text-decoration:none; cursor:pointer;
      box-shadow:var(--shadow); transition:background .14s,transform .14s,border-color .14s, box-shadow .14s;
      backdrop-filter: blur(12px);
    }
    .tile:nth-child(1) { background:linear-gradient(180deg, rgba(86,135,183,.28), rgba(44,70,101,.95)); }
    .tile:nth-child(2) { background:linear-gradient(180deg, rgba(86,173,161,.24), rgba(37,85,88,.96)); }
    .tile:nth-child(3) { background:linear-gradient(180deg, rgba(137,109,183,.24), rgba(78,68,109,.96)); }
    .tile:nth-child(4) { background:linear-gradient(180deg, rgba(179,129,88,.22), rgba(98,74,57,.96)); }
    .tile .emoji { font-size:clamp(56px,5.2vw,82px); line-height:1; filter:drop-shadow(0 6px 10px rgba(0,0,0,.20)); }
    .tile:hover, .item:hover, .back:hover { border-color:#92daff; }
    .tile:focus-visible, .item:focus-visible, .back:focus-visible,
    .tile.remote-selected, .item.remote-selected, .back.remote-selected {
      outline:4px solid rgba(255,255,255,.92); outline-offset:4px; border-color:var(--focus);
      box-shadow:0 0 0 7px rgba(79,196,255,.28), var(--shadow);
      transform:translateY(-3px) scale(1.012); z-index:1;
    }
    .titlebar { display:flex; align-items:center; gap:22px; margin-bottom:28px; }
    .back {
      color:#fff; background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
      border:3px solid rgba(255,255,255,.06); border-radius:24px; font-size:clamp(22px,1.9vw,28px);
      min-width:180px; min-height:94px; padding:10px 24px; cursor:pointer; white-space:nowrap;
      display:flex; align-items:center; justify-content:center; gap:12px; box-shadow:var(--shadow-soft);
      font-weight:800; backdrop-filter: blur(10px);
    }
    .back .icon { font-size:32px; line-height:1; }
    .back .label { display:flex; flex-direction:column; align-items:flex-start; line-height:1.1; }
    .back .label small { font-size:.76em; color:#c7d8e7; font-weight:700; }
    .item {
      display:flex; justify-content:flex-start; align-items:center; text-align:left;
      min-height:118px; border-radius:24px; border:3px solid rgba(255,255,255,.05); padding:24px 30px;
      color:white; background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      text-decoration:none; font-size:clamp(28px,2.3vw,38px); font-weight:760; line-height:1.3;
      overflow-wrap:anywhere; cursor:pointer; box-shadow:var(--shadow-soft);
    }
    .item.missing { color:#c3ccd5; background:linear-gradient(180deg, rgba(84,92,105,.35), rgba(49,58,69,.82)); cursor:default; }
    .empty, .error {
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border-radius:22px; padding:26px 28px; font-size:24px; color:#dce7f1;
      border:1px solid rgba(255,255,255,.07);
    }
    .foot { color:#a8bbcf; text-align:center; font-size:clamp(16px,1.35vw,21px); margin-top:34px; line-height:1.65; }
    .error { color:#fff1dd; background:linear-gradient(180deg, rgba(133,91,49,.55), rgba(85,56,28,.95)); }
    [hidden] { display:none !important; }
    @media(max-width:900px) {
      .titlebar{align-items:stretch; flex-direction:column;}
      .back{width:100%; justify-content:flex-start;}
    }
    @media(max-width:720px) {
      .menu { grid-template-columns:1fr; }
      .tile { min-height:160px; }
      .items { max-width:none; }
    }
    @media(max-width:430px) {
      .shell{padding:18px 16px 32px;} .menu{gap:12px;} .tile{min-height:138px;padding:18px;border-radius:22px;font-size:26px;} .items{grid-template-columns:1fr;} .tile .emoji{font-size:42px;} .back{min-height:82px; min-width:unset; width:100%;}
    }
    @media(prefers-reduced-motion:reduce) { .tile, .item, .back {transition:none;} }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="branding">
        <h1 id="page-title">우리집 영상관</h1>
        <p id="header-copy" class="header-copy">부모님이 편하게 볼 수 있게 만든 우리집 전용 영상관이에요.</p>
      </div>
      <div id="brand-mark" class="mark" aria-hidden="true">🏠</div>
    </header>
    <section id="home">
      <p class="subtitle">보고 싶은 곳을 선택하세요</p>
      <div class="menu" id="menu"></div>
    </section>
    <section id="listing" hidden>
      <div class="titlebar">
        <button id="back" class="back remote-focus" type="button"><span class="icon" aria-hidden="true">🏠</span><span class="label"><span>처음으로</span><small>홈으로 돌아가기</small></span></button>
      </div>
      <div class="items" id="items"></div>
    </section>
    <p id="error" class="error" hidden></p>
    <p id="sync-status" class="foot" hidden></p>
    <p id="guide-text" class="foot">방향키로 이동 · 확인 버튼으로 선택 · 뒤로 가기로 이전 화면</p>
  </main>
  <script src="catalog.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    (function () {
      'use strict';
      var categories = [
        {id:'drama',title:'드라마',icon:'🖥️'},
        {id:'movie',title:'영화',icon:'🎞️'},
        {id:'variety',title:'예능',icon:'🎭'},
        {id:'favorites',title:'자주 보기',icon:'💖'}
      ];
      var home = document.getElementById('home');
      var listing = document.getElementById('listing');
      var menu = document.getElementById('menu');
      var items = document.getElementById('items');
      var pageTitle = document.getElementById('page-title');
      var headerCopy = document.getElementById('header-copy');
      var guideText = document.getElementById('guide-text');
      var brandMark = document.getElementById('brand-mark');
      var errorEl = document.getElementById('error');
      var backBtn = document.getElementById('back');
      var records = Array.isArray(window.SITE_CATALOG) ? window.SITE_CATALOG : [];
      var syncStatus = document.getElementById('sync-status');
      // 서버 연결이 끊겨도 마지막으로 받아 온 목록을 보여 줍니다.
      try {
        var cached = JSON.parse(localStorage.getItem('familyTvCatalogCache') || 'null');
        if (Array.isArray(cached)) records = cached;
      } catch (_) { /* 저장소 차단 등: 기본 catalog.js 사용 */ }
      function syncMessage(message) {
        syncStatus.textContent = message || '';
        syncStatus.hidden = !message;
      }
      function initOnlineCatalog() {
        var cfg = window.FAMILY_TV_FIREBASE;
        if (!cfg || !cfg.apiKey || !cfg.projectId) return; // 아직 설정 전에는 기존 사이트 그대로
        if (!window.firebase || !firebase.firestore) {
          syncMessage('온라인 목록을 불러오지 못했어요. 저장된 목록을 표시하고 있어요.');
          return;
        }
        try {
          var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
          app.firestore().doc('familyTv/catalog').onSnapshot(function(snapshot) {
            if (!snapshot.exists || !Array.isArray(snapshot.data().items)) {
              syncMessage('아직 온라인 작품 목록이 등록되지 않았어요.');
              return;
            }
            var fresh = snapshot.data().items;
            if (JSON.stringify(records) !== JSON.stringify(fresh)) {
              records = fresh;
              try { localStorage.setItem('familyTvCatalogCache', JSON.stringify(fresh)); } catch (_) {}
              render();
            }
            syncMessage('');
          }, function(error) {
            if (error && error.code === 'permission-denied') {
              syncMessage('온라인 목록 연결을 준비 중이에요. 기존 목록을 표시하고 있어요.');
            } else {
              syncMessage('인터넷 연결을 확인해 주세요. 마지막으로 저장된 목록을 표시하고 있어요.');
            }
          });
        } catch (_) {
          syncMessage('온라인 목록에 연결하지 못했어요. 저장된 목록을 표시하고 있어요.');
        }
      }
      function safeUrl(raw) {
        if (typeof raw !== 'string' || !raw.trim()) return '';
        try { var u=new URL(raw.trim()); return u.protocol==='https:' || u.protocol==='http:' ? u.href : ''; }
        catch (_) { return ''; }
      }
      function addClassFocus(el) {
        document.querySelectorAll('.remote-selected').forEach(function(x){x.classList.remove('remote-selected');});
        if (el) el.classList.add('remote-selected');
      }
      document.addEventListener('focusin',function(e){if(e.target.classList && e.target.classList.contains('remote-focus')) addClassFocus(e.target);});
      function makeButton(text, css, handler) {
        var b=document.createElement('button'); b.type='button'; b.className=css+' remote-focus'; b.textContent=text; b.addEventListener('click',handler); return b;
      }
      categories.forEach(function(c){
        var b=document.createElement('button'); b.type='button'; b.className='tile remote-focus';
        var icon=document.createElement('span'); icon.className='emoji'; icon.setAttribute('aria-hidden','true'); icon.textContent=c.icon;
        var name=document.createElement('span'); name.textContent=c.title;
        b.appendChild(icon); b.appendChild(name);
        b.addEventListener('click',function(){location.hash=c.id;}); menu.appendChild(b);
      });
      function goHome(){ history.replaceState(null,'',location.href.split('#')[0]); render(); }
      backBtn.addEventListener('click',goHome);
      function render() {
        var id=decodeURIComponent(location.hash.replace(/^#/,''));
        var cat=categories.find(function(c){return c.id===id;});
        var isListing=Boolean(cat);
        home.hidden=isListing; listing.hidden=!isListing; brandMark.hidden=isListing;
        errorEl.hidden=true;
        if(!isListing){
          document.title='우리집 영상관';
          pageTitle.textContent='우리집 영상관';
          headerCopy.textContent='부모님이 편하게 볼 수 있게 만든 우리집 전용 영상관이에요.';
          guideText.textContent='방향키로 이동 · 확인 버튼으로 선택 · 뒤로 가기로 이전 화면';
          addClassFocus(null);
          return;
        }
        document.title=cat.title+' · 우리집 영상관';
        pageTitle.textContent=cat.title;
        headerCopy.textContent='보고 싶은 작품을 골라 바로 재생하세요.';
        guideText.textContent='위아래 방향키로 이동 · 확인 버튼으로 선택 · 뒤로 가기로 이전 화면';
        items.textContent='';
        var entries=records.filter(function(item){return item && (id==='favorites'? item.favorite===true : item.category===id);});
        if(!entries.length){var empty=document.createElement('p'); empty.className='empty'; empty.textContent='아직 등록된 작품이 없어요.';items.appendChild(empty);}
        entries.forEach(function(item){
          var url=safeUrl(item.url); var title=(typeof item.title==='string' && item.title.trim())?item.title:'제목 없음';
          var el;
          if(url){el=document.createElement('a');el.href=url;el.textContent=title;el.className='item remote-focus';el.rel='noreferrer';}
          else {el=makeButton(title+' (주소 미등록)','item missing',function(){errorEl.textContent='아직 영상 주소를 등록하지 않았어요.';errorEl.hidden=false;});}
          items.appendChild(el);
        });
        addClassFocus(null);
        var firstItem=items.querySelector('.remote-focus');
        if(firstItem) firstItem.focus(); else backBtn.focus();
      }
      function chooseNext(key, current, navigables){
        if (!current || !navigables.includes(current)) return navigables[0];
        var a=current.getBoundingClientRect(); var acx=a.left+a.width/2, acy=a.top+a.height/2;
        var candidates=navigables.filter(function(x){return x!==current;}).map(function(x){
          var b=x.getBoundingClientRect(), dx=b.left+b.width/2-acx, dy=b.top+b.height/2-acy;
          var primary=key==='ArrowRight'?dx:key==='ArrowLeft'?-dx:key==='ArrowDown'?dy:-dy;
          var secondary=(key==='ArrowRight'||key==='ArrowLeft')?Math.abs(dy):Math.abs(dx);
          return {el:x,primary:primary,score:primary+secondary*3};
        }).filter(function(x){return x.primary>6;}).sort(function(a,b){return a.score-b.score;});
        return candidates.length?candidates[0].el:current;
      }
      document.addEventListener('keydown',function(e){
        var key=e.key;
        if(key==='Escape'||key==='Backspace'||key==='BrowserBack'){
          if(!listing.hidden){e.preventDefault();goHome();}return;
        }
        if(!['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(key)) return;
        var navigables=Array.prototype.slice.call((listing.hidden?home:listing).querySelectorAll('.remote-focus'));
        
        if(!navigables.length)return;
        var next=chooseNext(key,document.activeElement,navigables);
        e.preventDefault(); if(next)next.focus();
      });
      window.addEventListener('hashchange',render);window.addEventListener('popstate',render);
      render();
      initOnlineCatalog();
    }());
  </script>
</body>
</html>
